name: Excavator

on:
  push:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:
  schedule:
    # run every 24 hours
    - cron: '10 5 * * *'

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@main
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
